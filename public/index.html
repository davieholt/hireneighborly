<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HireNeighborly</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="description" content="Coming soon.">
<link rel="canonical" href="https://hireneighborly.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1e3f73;
    --brass:#c9a978;
    --paper:#fffdfb;
    --silt:#e5dbd0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--navy);
    color:var(--paper);
    font-family:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px;
    -webkit-font-smoothing:antialiased;
  }
  main{max-width:520px}
  .mark{
    width:64px;height:64px;
    margin:0 auto 28px;
    border:1.5px solid var(--brass);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:"Playfair Display",Georgia,serif;
    font-size:22px;
    letter-spacing:.10em;
    text-indent:.10em;
    color:var(--brass);
  }
  h1{
    font-family:"Playfair Display",Georgia,serif;
    font-weight:600;
    font-size:clamp(30px,7vw,46px);
    line-height:1.15;
    letter-spacing:-.005em;
  }
  .rule{
    width:44px;height:1px;
    background:var(--brass);
    margin:22px auto;
    opacity:.7;
  }
  p{
    font-size:clamp(15px,3.4vw,17px);
    line-height:1.6;
    color:var(--silt);
  }
  footer{
    position:fixed;
    left:0;right:0;bottom:20px;
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:rgba(229,219,208,.45);
  }
  @media (prefers-reduced-motion:no-preference){
    main{animation:rise .6s ease-out both}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">HN</div>
    <h1>HireNeighborly</h1>
    <div class="rule" role="presentation"></div>
    <p>Coming soon.</p>
  </main>
  <footer>hireneighborly.com</footer>
</body>
</html>
